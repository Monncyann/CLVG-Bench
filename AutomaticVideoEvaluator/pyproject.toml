[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-video-evaluator"
version = "0.1.0"
description = "A self-contained implementation of the Adaptive Video Evaluator (AVE)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.97.1,<3",
  "opencv-python-headless>=4.10,<5",
  "json-repair>=0.50,<1",
  "tqdm>=4.66,<5",
  "huggingface_hub>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["ave*"]
